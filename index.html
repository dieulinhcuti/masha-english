<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Английский с Машей 🌸</title>
<style>
:root{
  --pink:#ff8fc0; --pink-soft:#ffd6e8; --lav:#c9b6ff; --lav-soft:#ece4ff;
  --mint:#7fe3c4; --sun:#ffd166; --ink:#4a2d52; --card:#fffafd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#ffe9f4 0%,#f3e8ff 50%,#e8f7ff 100%);min-height:100vh;
  padding:14px 12px 40px;}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:26px;text-align:center;margin:6px 0 2px;color:#d6558f;text-shadow:0 2px 0 #fff}
.sub{text-align:center;font-size:14px;color:#8a6a95;margin-bottom:14px}
.stars{text-align:center;font-size:18px;margin-bottom:10px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:3px solid var(--pink-soft);border-radius:22px;padding:14px 10px;
  text-align:center;cursor:pointer;box-shadow:0 6px 0 #f1d9ea;transition:.15s;}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #f1d9ea}
.tile .emo{font-size:30px;display:block;margin-bottom:4px}
.tile .nm{font-weight:bold;font-size:15px}
.tile .cnt{font-size:12px;color:#9b7fae;margin-top:3px}
.card{background:var(--card);border:3px solid var(--lav-soft);border-radius:24px;padding:16px;
  box-shadow:0 8px 0 #e3d8f7}
.bar{height:12px;background:#f0e4f7;border-radius:10px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));width:0;transition:.3s}
.q{font-size:21px;line-height:1.45;text-align:center;margin:6px 0 16px;min-height:62px}
.q b{color:#d6558f}
.hint{font-size:14px;color:#8a6a95;text-align:center;margin-top:-10px;margin-bottom:12px}
.opts{display:grid;gap:10px}
.opt{background:#fff;border:3px solid var(--lav-soft);border-radius:18px;padding:13px;font-size:19px;
  cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.12s}
.opt:active{transform:scale(.98)}
.opt.ok{background:#ddfff2;border-color:var(--mint)}
.opt.no{background:#ffe3ee;border-color:var(--pink)}
.fb{text-align:center;font-size:17px;min-height:26px;margin-top:12px;font-weight:bold}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;background:linear-gradient(180deg,#ffa8cf,#ff7fb8);color:#fff;border:0;border-radius:18px;
  padding:13px;font-size:17px;font-weight:bold;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 #e06ba0}
.btn.ghost{background:#fff;color:#a06bbd;box-shadow:0 5px 0 #e3d8f7}
.btn:active{transform:translateY(3px);box-shadow:none}
.word{text-align:center;padding:10px 0}
.word .en{font-size:34px;font-weight:bold;color:#d6558f}
.word .tr{font-size:17px;color:#9b7fae;margin:6px 0}
.word .ru{font-size:26px;margin-top:10px;min-height:34px}
.done{text-align:center;padding:18px 6px}
.done .big{font-size:52px}
.rules{background:#fff6fb;border:2px dashed var(--pink);border-radius:18px;padding:12px;margin-top:14px;font-size:15px;line-height:1.5}
.rules h3{margin:0 0 6px;font-size:16px;color:#d6558f}
.rules b{color:#d6558f}
.say{background:#fff;border:3px solid var(--sun);border-radius:50%;width:54px;height:54px;font-size:24px;
  cursor:pointer;box-shadow:0 4px 0 #e9bb4f;margin-top:8px}
.say:active{transform:translateY(3px);box-shadow:none}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.let{background:#fff;border:3px solid var(--lav-soft);border-radius:14px;min-width:44px;padding:10px 6px;
  font-size:22px;font-weight:bold;font-family:inherit;color:var(--ink);cursor:pointer}
.slot{min-height:52px;border-bottom:3px dashed var(--pink);font-size:28px;letter-spacing:2px;
  text-align:center;padding:6px 0;color:#d6558f;font-weight:bold}
.small{font-size:13px;color:#8a6a95;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Английский с Машей 🌸</h1>
  <div class="sub">Тренируемся к самостоятельной во вторник</div>
  <div class="stars" id="stars"></div>
  <div id="app"></div>
</div>
<script>
const WORDS=[
 ["holiday","[ˈhɒlədeɪ]","каникулы"],["curly","[ˈkɜːli]","кудрявый"],["fair","[feə]","светлый"],
 ["straight","[streɪt]","прямой"],["hair","[heə]","волосы"],["brother","[ˈbrʌðə]","брат"],
 ["sister","[ˈsɪstə]","сестра"],["pet","[pet]","питомец"],["rabbit","[ˈræbɪt]","кролик"],
 ["watch","[wɒtʃ]","наручные часы"],["homework","[ˈhəʊmwɜːk]","домашняя работа"],
 ["swimming pool","[ˈswɪmɪŋ puːl]","бассейн"],["wind","[wɪnd]","ветер"],["cloud","[klaʊd]","облако"],
 ["heavy","[ˈhevi]","тяжёлый"],["tall","[tɔːl]","высокий"]
];
const SECTIONS=[
 {id:"have",emo:"🐰",nm:"have / has got",qs:[
  ["I ___ a rabbit.",["have got","has got"],0,"Я, ты, мы, они → have got"],
  ["She ___ long hair.",["has got","have got"],0,"Она, он, оно → has got"],
  ["My brother ___ a watch.",["has got","have got"],0,"brother = he → has got"],
  ["We ___ a swimming pool.",["have got","has got"],0,"we → have got"],
  ["Masha ___ curly hair.",["has got","have got"],0,"одно имя = she → has got"],
  ["They ___ two pets.",["have got","has got"],0,"they → have got"],
  ["___ you got a sister?",["Have","Has"],0,"вопрос с you → Have"],
  ["___ he got homework?",["Has","Have"],0,"вопрос с he → Has"],
  ["He ___ got a dog. (отрицание)",["hasn't","haven't"],0,"he → hasn't got"],
  ["I ___ got a cat. (отрицание)",["haven't","hasn't"],0,"I → haven't got"]]},
 {id:"there",emo:"🏠",nm:"there is / are",qs:[
  ["___ a rabbit in the garden.",["There is","There are"],0,"один кролик → there is"],
  ["___ five clouds in the sky.",["There are","There is"],0,"пять облаков → there are"],
  ["___ a swimming pool near my house.",["There is","There are"],0,"один бассейн → there is"],
  ["___ two sisters in my family.",["There are","There is"],0,"две сестры → there are"],
  ["___ some milk in the cup.",["There is","There are"],0,"milk не считается → there is"],
  ["___ many pets in the shop.",["There are","There is"],0,"many → множественное"],
  ["___ there a watch on the table?",["Is","Are"],0,"один предмет → Is there"],
  ["___ there any books?",["Are","Is"],0,"books множественное → Are there"]]},
 {id:"adv",emo:"⏰",nm:"Наречия частоты",qs:[
  ["always это ...",["всегда","никогда","иногда"],0,"always = всегда, 100%"],
  ["usually это ...",["обычно","всегда","часто"],0,"usually = обычно"],
  ["often это ...",["часто","редко","никогда"],0,"often = часто"],
  ["sometimes это ...",["иногда","всегда","обычно"],0,"sometimes = иногда"],
  ["never это ...",["никогда","иногда","часто"],0,"never = никогда, 0%"],
  ["Я всегда делаю домашку: I ___ do my homework.",["always","never"],0,"всегда → always"],
  ["Куда ставим наречие? I ___ swim.",["often swim","swim often"],0,"перед глаголом: I often swim"],
  ["She is ___ late.",["never","never is"],0,"после глагола to be: she is never"],
  ["Расставь по порядку от 100% к 0%:",["always, usually, often, sometimes, never","never, often, always, usually, sometimes"],0,"always 100%, never 0%"]]},
 {id:"ger",emo:"🏊",nm:"Герундий -ing",qs:[
  ["I like ___ . (swim)",["swimming","swim"],0,"после like ставим -ing: swimming"],
  ["She likes ___ books. (read)",["reading","read"],0,"read + ing = reading"],
  ["Удваиваем ли согласную: swim + ing?",["swimming","swiming"],0,"короткое слово, согласная удваивается"],
  ["make + ing =",["making","makeing"],0,"немая e убирается: making"],
  ["run + ing =",["running","runing"],0,"удваиваем n: running"],
  ["play + ing =",["playing","plaing"],0,"play не меняется: playing"],
  ["Герундий это ...",["отглагольное существительное","вопрос","множественное число"],0,"swimming = плавание"],
  ["I'm good at ___ . (dance)",["dancing","dance"],0,"немая e убирается: dancing"]]},
 {id:"num",emo:"🔢",nm:"Числительные",qs:[
  ["12 это ...",["twelve","twenty"],0,"12 = twelve"],
  ["13 это ...",["thirteen","thirty"],0,"13 = thirteen, 30 = thirty"],
  ["15 это ...",["fifteen","fiveteen"],0,"пишем fifteen"],
  ["18 это ...",["eighteen","eightteen"],0,"одна t: eighteen"],
  ["20 это ...",["twenty","twelve"],0,"20 = twenty"],
  ["twenty-one это ...",["21","12"],0,"twenty-one = 21"],
  ["40 это ...",["forty","fourty"],0,"без u: forty"],
  ["100 это ...",["a hundred","a thousand"],0,"hundred = 100"],
  ["Какой по счёту: first это ...",["первый","четвёртый"],0,"first = первый"],
  ["third это ...",["третий","тринадцатый"],0,"third = третий"]]},
 {id:"plu",emo:"🐭",nm:"Множественное число",qs:[
  ["cat →",["cats","cates"],0,"просто +s"],
  ["box →",["boxes","boxs"],0,"после x добавляем -es"],
  ["baby →",["babies","babys"],0,"y после согласной → ies"],
  ["boy →",["boys","boies"],0,"y после гласной → просто +s"],
  ["leaf →",["leaves","leafs"],0,"f → ves"],
  ["man →",["men","mans"],0,"особое слово: man → men"],
  ["child →",["children","childs"],0,"особое слово: child → children"],
  ["mouse →",["mice","mouses"],0,"особое слово: mouse → mice"],
  ["foot →",["feet","foots"],0,"особое слово: foot → feet"],
  ["tooth →",["teeth","tooths"],0,"особое слово: tooth → teeth"],
  ["fish →",["fish","fishes"],0,"не меняется: fish"],
  ["watch →",["watches","watchs"],0,"после ch добавляем -es"]]}
];
const RULES={
 have:"<h3>Как не путать</h3><b>I, you, we, they → have got</b><br><b>he, she, it → has got</b><br>Одно имя (Masha, my brother) это he или she, значит <b>has got</b>.<br>Отрицание: haven\u2019t got / hasn\u2019t got. Вопрос: Have you got...? Has he got...?",
 there:"<h3>Как не путать</h3><b>There is</b> про один предмет и про то, что не считают (milk, water).<br><b>There are</b> про много.<br>Вопрос: Is there...? Are there...?",
 adv:"<h3>Как не путать</h3>always 100%, usually, often, sometimes, never 0%.<br>Наречие стоит <b>перед обычным глаголом</b>: I often swim.<br>Но <b>после am, is, are</b>: She is never late.",
 ger:"<h3>Как не путать</h3>После like, love, enjoy, good at ставим <b>-ing</b>.<br>Немая e убегает: make → making.<br>Короткое слово с одной гласной удваивает согласную: swim → swimming, run → running.<br>play не меняется: playing.",
 num:"<h3>Как не путать</h3>13 thirteen, а 30 thirty. 15 fifteen (не fiveteen). 18 eighteen (одна t). 40 forty (без u).<br>Порядковые: first, second, third, затем +th.",
 plu:"<h3>Как не путать</h3>Обычно <b>+s</b>.<br>После s, x, ch, sh → <b>+es</b>: boxes, watches.<br>y после согласной → <b>ies</b>: baby → babies. y после гласной → +s: boys.<br>f → ves: leaf → leaves.<br>Запомнить: man → men, child → children, mouse → mice, foot → feet, tooth → teeth, fish → fish."
};
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
const KEY="masha-eng-v1";
let store=JSON.parse(localStorage.getItem(KEY)||"{}");
const save=()=>localStorage.setItem(KEY,JSON.stringify(store));
const app=document.getElementById("app");
function showStars(){
  const t=Object.keys(store).filter(k=>typeof store[k]==="number").reduce((a,k)=>a+store[k],0);
  document.getElementById("stars").textContent="⭐ "+t+(t?" звёздочек":" звёздочек, поехали!");
}
function menu(){
  showStars();
  app.innerHTML='<div class="menu">'+SECTIONS.map((s,i)=>
    `<div class="tile" data-i="${i}"><span class="emo">${s.emo}</span><span class="nm">${s.nm}</span>
     <div class="cnt">${s.qs.length} заданий · ⭐ ${store[s.id]||0}</div></div>`).join('')+
    `<div class="tile" data-i="words"><span class="emo">🌈</span><span class="nm">Слова</span>
     <div class="cnt">${WORDS.length} слов, 4 режима</div></div>
     <div class="tile" data-i="all"><span class="emo">👑</span><span class="nm">Всё подряд</span>
     <div class="cnt">проверка на вторник</div></div>
     <div class="tile" data-i="err"><span class="emo">🩹</span><span class="nm">Мои ошибки</span>
     <div class="cnt">${(store.M||[]).length} заданий</div></div></div>`;
  app.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
    const v=t.dataset.i;
    if(v==="words") return wordMenu();
    if(v==="err"){
      const e=(store.M||[]);
      if(!e.length){alert("Ошибок нет! Можно идти гулять 🌸");return;}
      return quiz({id:"err",nm:"Мои ошибки",qs:e.slice()});
    }
    if(v==="all") return quiz({id:"all",nm:"Всё подряд",qs:shuffle([].concat(...SECTIONS.map(s=>s.qs))).slice(0,20)});
    rules(SECTIONS[+v]);
  });
}
function rules(sec){
  app.innerHTML=`<div class="card">
    <div class="q" style="min-height:0">${sec.emo} ${sec.nm}</div>
    <div class="rules">${RULES[sec.id]||""}</div>
    <div class="row"><button class="btn" id="go">Поехали →</button>
    <button class="btn ghost" id="back">← в меню</button></div></div>`;
  app.querySelector("#go").onclick=()=>quiz(sec);
  app.querySelector("#back").onclick=menu;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function quiz(sec){
  let queue=shuffle(sec.qs), total=queue.length, done=0, got=0, cur=null, locked=false;
  const praise=["Умница! 🌸","Супер! ✨","Верно! 💖","Молодец! 🦄","Так держать! 🌟"];
  function draw(){
    if(!queue.length) return finish();
    cur=queue[0];
    const opts=shuffle(cur[1].map((t,i)=>({t,ok:i===cur[2]})));
    app.innerHTML=`<div class="card">
      <div class="bar"><i style="width:${Math.round(done/total*100)}%"></i></div>
      <div class="q">${cur[0].replace(/___/g,"<b>___</b>")}</div>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" data-ok="${o.ok}" data-i="${i}">${o.t}</button>`).join("")}</div>
      <div class="fb" id="fb"></div>
      <div class="row"><button class="btn ghost" id="back">← назад</button></div></div>`;
    app.querySelector("#back").onclick=menu;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b));
    locked=false;
  }
  function pick(b){
    if(locked) return; locked=true;
    const fb=app.querySelector("#fb");
    const right=b.dataset.ok==="true";
    app.querySelectorAll(".opt").forEach(x=>{if(x.dataset.ok==="true")x.classList.add("ok")});
    if(right){
      b.classList.add("ok"); got++; done++;
      fb.textContent=praise[Math.floor(Math.random()*praise.length)];
      if(cur[4]) say(cur[4]);
      queue.shift();
      store[sec.id]=(store[sec.id]||0)+1; save();
    }else{
      b.classList.add("no");
      fb.innerHTML="Почти! "+cur[3];
      const q=queue.shift(); queue.push(q); total++;
      store.M=(store.M||[]);
      if(!store.M.some(x=>x[0]===q[0])) store.M.push(q);
      if(store.M.length>30) store.M.shift();
      save();
    }
    setTimeout(draw, right?700:2300);
  }
  function finish(){
    if(sec.id==="err"){ store.M=[]; save(); }
    app.innerHTML=`<div class="card done"><div class="big">🎉</div>
      <h2>Готово, ${sec.nm}!</h2>
      <p>Правильных ответов: <b>${got}</b></p>
      <p>Звёздочек всего: <b>${Object.keys(store).filter(k=>typeof store[k]==="number").reduce((a,k)=>a+store[k],0)}</b> ⭐</p>
      <div class="row"><button class="btn" id="again">Ещё раз</button>
      <button class="btn ghost" id="back">В меню</button></div></div>`;
    app.querySelector("#again").onclick=()=>quiz(sec);
    app.querySelector("#back").onclick=menu;
    showStars();
  }
  draw();
}
function wordMenu(){
  app.innerHTML=`<div class="card">
    <div class="q" style="min-height:0">🌈 Слова</div>
    <div class="opts">
      <button class="opt" id="m1">🃏 Карточки: смотрю и слушаю</button>
      <button class="opt" id="m2">🇬🇧 → 🇷🇺 Что это значит?</button>
      <button class="opt" id="m3">🇷🇺 → 🇬🇧 Как по-английски?</button>
      <button class="opt" id="m4">🔤 Собери слово по буквам</button>
    </div>
    <div class="row"><button class="btn ghost" id="back">← в меню</button></div></div>`;
  app.querySelector("#m1").onclick=()=>words(0);
  app.querySelector("#m2").onclick=()=>wordQuiz("en2ru");
  app.querySelector("#m3").onclick=()=>wordQuiz("ru2en");
  app.querySelector("#m4").onclick=()=>spell(shuffle(WORDS),0,0);
  app.querySelector("#back").onclick=menu;
}
function wordQuiz(mode){
  const qs=WORDS.map(w=>{
    const wrong=shuffle(WORDS.filter(x=>x[0]!==w[0])).slice(0,2);
    if(mode==="en2ru") return [w[0]+" это ...",[w[2],wrong[0][2],wrong[1][2]],0,w[0]+" = "+w[2],w[0]];
    return ["«"+w[2]+"» по-английски ...",[w[0],wrong[0][0],wrong[1][0]],0,w[2]+" = "+w[0],w[0]];
  });
  quiz({id:"w-"+mode,nm:mode==="en2ru"?"Слова: перевод":"Слова: по-английски",qs:shuffle(qs)});
}
function spell(list,i,got){
  if(i>=list.length){
    app.innerHTML=`<div class="card done"><div class="big">🎉</div><h2>Все слова собраны!</h2>
      <p>С первого раза: <b>${got}</b> из ${list.length}</p>
      <div class="row"><button class="btn" id="again">Ещё раз</button>
      <button class="btn ghost" id="back">В меню</button></div></div>`;
    app.querySelector("#again").onclick=()=>spell(shuffle(WORDS),0,0);
    app.querySelector("#back").onclick=menu; showStars(); return;
  }
  const w=list[i], target=w[0];
  let typed="", first=true;
  const letters=shuffle(target.split("").map((c,k)=>({c,k})));
  function draw(){
    app.innerHTML=`<div class="card">
      <div class="bar"><i style="width:${Math.round(i/list.length*100)}%"></i></div>
      <div class="q" style="min-height:0">${w[2]}<br><span style="font-size:15px;color:#8a6a95">${w[1]}</span></div>
      <div class="slot">${typed.replace(/ /g,"␣")||"&nbsp;"}</div>
      <div class="letters">${letters.map((l,k)=>`<button class="let" data-k="${k}" ${l.used?"disabled style=opacity:.3":""}>${l.c===" "?"␣":l.c}</button>`).join("")}</div>
      <div class="fb" id="fb"></div>
      <div class="row"><button class="btn ghost" id="clr">стереть</button>
      <button class="btn ghost" id="back">← в меню</button></div></div>`;
    app.querySelectorAll(".let").forEach(b=>b.onclick=()=>{
      const l=letters[+b.dataset.k]; if(l.used) return;
      l.used=true; typed+=l.c; check();
    });
    app.querySelector("#clr").onclick=()=>{typed="";letters.forEach(l=>l.used=false);first=false;draw();};
    app.querySelector("#back").onclick=menu;
  }
  function check(){
    if(!target.startsWith(typed)){
      draw(); const fb=app.querySelector("#fb");
      fb.textContent="Не та буква, попробуй ещё 🌸"; first=false;
      typed=""; letters.forEach(l=>l.used=false);
      setTimeout(draw,1200); return;
    }
    if(typed===target){
      say(target); store["spell"]=(store["spell"]||0)+1; save();
      draw(); app.querySelector("#fb").innerHTML="Умница! "+target+" ✨";
      setTimeout(()=>spell(list,i+1,got+(first?1:0)),1400); return;
    }
    draw();
  }
  draw();
}
function words(i){
  const list=WORDS; const w=list[i];
  app.innerHTML=`<div class="card"><div class="bar"><i style="width:${Math.round((i+1)/list.length*100)}%"></i></div>
    <div class="word"><div class="en">${w[0]}</div><div class="tr">${w[1]}</div>
    <button class="say" id="say">🔊</button>
    <div class="ru" id="ru">нажми «перевод»</div></div>
    <div class="row"><button class="btn ghost" id="show">перевод</button>
    <button class="btn" id="next">дальше →</button></div>
    <div class="row"><button class="btn ghost" id="back">← в меню</button></div>
    <div class="small">${i+1} из ${list.length}</div></div>`;
  app.querySelector("#say").onclick=()=>say(w[0]);
  app.querySelector("#show").onclick=()=>{app.querySelector("#ru").textContent=w[2]};
  app.querySelector("#next").onclick=()=>i+1<list.length?words(i+1):wordMenu();
  app.querySelector("#back").onclick=menu;
  say(w[0]);
}
menu();
</script>
</body>
</html>
